name: Code Quality Check

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  lint-backend:
    name: Backend Check (Python / Ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend # Adapte si ton dossier backend a un autre nom

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Check formatting (Ruff)
        run: poetry run ruff format --check .

      - name: Check linter & imports (Ruff)
        run: poetry run ruff check .

  lint-frontend:
    name: Frontend Check (React / ESLint / Prettier)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend # Adapte si ton dossier front a un autre nom

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Check formatting (Prettier)
        run: npx prettier --check "src/**/*.{ts,tsx,js,jsx,json,css,md}"
