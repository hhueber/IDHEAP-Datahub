repos:
  # Backend lint and format (ruff)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.7
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [--fix]
      # Run the formatter.
      - id: ruff-format

  # Frontend formatting (prettier with .prettierrc as config file)
  - repo: local
    hooks:
      - id: prettier
        name: Prettier Frontend
        entry: bash -c 'cd frontend && npx prettier --write "${@#frontend/}"' --
        language: system
        files: ^frontend/src/.*\.(ts|tsx|js|jsx|json|css)$

  # Frontend Check (ESLint)
  - repo: local
    hooks:
      - id: frontend-eslint
        name: ESLint Frontend
        entry: npm --prefix frontend run lint
        language: system
        pass_filenames: false
        files: ^frontend/src/.*\.(ts|tsx|js|jsx)$
